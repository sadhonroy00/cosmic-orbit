<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic Orbit — Solar System</title>
<style>
:root{--cyan:#7cecff;--glass:rgba(7,13,31,.78);--line:rgba(124,236,255,.2)}
*{box-sizing:border-box}body{margin:0;background:#030611;color:#eaf5ff;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#space{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.5) 100%)}
header{position:fixed;top:20px;left:22px;z-index:2}header .eyebrow{letter-spacing:.25em;color:var(--cyan);font-size:10px}h1{font-size:clamp(22px,4vw,38px);margin:3px 0;letter-spacing:.08em}header p{margin:0;color:#9aaac7;font-size:12px}
.panel{position:fixed;z-index:3;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 12px 40px #0005}
#controls{left:18px;bottom:18px;padding:14px 16px;width:min(340px,calc(100vw - 36px))}
.controlrow{display:flex;align-items:center;gap:10px;margin:8px 0}.controlrow label{color:#a8bad7;min-width:74px;font-size:12px}
button{border:1px solid #29405f;background:#101c34;color:#eaf5ff;border-radius:9px;padding:8px 12px;cursor:pointer}button:hover,button.active{border-color:var(--cyan);color:var(--cyan)}input[type=range]{width:100%;accent-color:var(--cyan)}
#detail{right:18px;top:50%;transform:translateY(-50%);width:min(270px,calc(100vw - 36px));padding:16px}
#detail h2{margin:0 0 4px;font-size:22px}#detail .type{color:var(--cyan);font-size:11px;text-transform:uppercase;letter-spacing:.14em}
#detail p{color:#aab9d3;font-size:12px;margin:10px 0}#facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:#111d35;border-radius:9px;padding:8px}.fact small{display:block;color:#8b9bb7;font-size:10px}.fact b{font-size:12px}
#planetnav{position:fixed;z-index:3;top:18px;right:18px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:44vw}
#planetnav button{font-size:11px;padding:6px 9px}
.hint{position:fixed;bottom:18px;right:18px;color:#8090ae;font-size:11px;z-index:2}
@media(max-width:700px){header{top:12px;left:14px}header p{max-width:190px}#planetnav{top:auto;bottom:190px;left:12px;right:12px;max-width:none;justify-content:center}#planetnav button{padding:6px 8px}#detail{top:76px;right:12px;transform:none;width:calc(100vw - 24px);padding:11px}#detail p{display:none}#facts{grid-template-columns:repeat(4,1fr)}.fact{padding:5px}#controls{left:12px;bottom:12px;width:calc(100vw - 24px);padding:10px 12px}.hint{display:none}}
</style>
</head>
<body>
<canvas id="space"></canvas><div class="vignette"></div>
<header><div class="eyebrow">COSMIC ORBIT / EXPLORATION</div><h1>THE SOLAR SYSTEM</h1><p>An interactive journey through our celestial neighborhood</p></header>
<nav id="planetnav" aria-label="Select celestial body"></nav>
<section id="detail" class="panel"><div class="type">Star · G2V</div><h2 id="name">The Sun</h2><p id="desc">The star at the heart of our solar system. Its gravity holds the planets in orbit.</p><div id="facts"></div></section>
<section id="controls" class="panel">
<div class="controlrow"><button id="toggle">Ⅱ Pause</button><button id="orbits" class="active">◎ Orbits</button><button id="labels" class="active">Aa Labels</button><button id="reset">↺ Reset</button></div>
<div class="controlrow"><label for="speed">Simulation</label><input id="speed" type="range" min="0" max="5" step=".1" value="1"><b id="speedval">1.0×</b></div>
<div class="controlrow"><label for="zoom">Zoom</label><input id="zoom" type="range" min=".55" max="1.7" step=".05" value="1"></div>
</section><div class="hint">Tap a planet to explore · Drag to rotate view</div>
<script>
const canvas=document.querySelector('#space'),ctx=canvas.getContext('2d');
const planets=[
{name:'Mercury',color:'#a9a5a0',size:3.5,orbit:.105,period:88,type:'Terrestrial planet',diameter:'4,879 km',distance:'57.9 million km',year:'88 Earth days',day:'58.6 Earth days',moons:'0',desc:'The smallest planet, racing around the Sun in just 88 Earth days.'},
{name:'Venus',color:'#e6c28b',size:5.5,orbit:.16,period:225,type:'Terrestrial planet',diameter:'12,104 km',distance:'108.2 million km',year:'225 Earth days',day:'243 Earth days',moons:'0',desc:'A brilliant world wrapped in thick clouds, with a surface hot enough to melt lead.'},
{name:'Earth',color:'#4c9cff',size:6.5,orbit:.22,period:365,type:'Terrestrial planet',diameter:'12,742 km',distance:'149.6 million km',year:'365.25 days',day:'23 h 56 min',moons:'1',desc:'Our home planet: the only world currently known to support life.'},
{name:'Mars',color:'#e87555',size:5,orbit:.285,period:687,type:'Terrestrial planet',diameter:'6,779 km',distance:'227.9 million km',year:'687 Earth days',day:'24 h 37 min',moons:'2',desc:'The red planet, home to ancient river valleys and the tallest volcano known in the solar system.'},
{name:'Jupiter',color:'#d9ae83',size:13,orbit:.405,period:4333,type:'Gas giant',diameter:'139,820 km',distance:'778.6 million km',year:'11.86 Earth years',day:'9 h 56 min',moons:'95+',desc:'The giant of our planetary system, with swirling cloud bands and a centuries-old Great Red Spot.'},
{name:'Saturn',color:'#e4d2a5',size:11,orbit:.53,period:10759,type:'Gas giant',diameter:'116,460 km',distance:'1.43 billion km',year:'29.45 Earth years',day:'10 h 42 min',moons:'146+',desc:'Famous for its spectacular rings made mostly of ice and rocky debris.'},
{name:'Uranus',color:'#83d9df',size:8,orbit:.65,period:30687,type:'Ice giant',diameter:'50,724 km',distance:'2.87 billion km',year:'84 Earth years',day:'17 h 14 min',moons:'28',desc:'An ice giant that rotates on its side, giving it extreme seasonal changes.'},
{name:'Neptune',color:'#557bff',size:8,orbit:.77,period:60190,type:'Ice giant',diameter:'49,244 km',distance:'4.50 billion km',year:'164.8 Earth years',day:'16 h 6 min',moons:'16',desc:'A distant blue world with supersonic winds and a dynamic atmosphere.'}
];
let W,H,dpr,angle=0,playing=true,showOrbits=true,showLabels=true,speed=1,zoom=1,drag=false,lastX=0,viewAngle=0,selected=-1;
let stars=[];
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.max(180,Math.floor(W*H/2600))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.35+.15,a:Math.random()*.7+.2,phase:Math.random()*6}));}
addEventListener('resize',resize);resize();
function center(){return{x:W*(W<700?.5:.47),y:H*(W<700?.48:.53)}}
function orbitScale(){return Math.min(W,H)*.48*zoom}
function pos(p,i){let c=center(),r=orbitScale()*p.orbit,theta=angle*(365/p.period)+i*1.7;return{x:c.x+Math.cos(theta)*r,y:c.y+Math.sin(theta)*r*.55,z:Math.sin(theta)}}
function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,0,x,y,r*3);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,Math.PI*2);ctx.fill()}
function draw(){
ctx.clearRect(0,0,W,H);
let bg=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,Math.max(W,H)*.75);bg.addColorStop(0,'#101a3a');bg.addColorStop(.5,'#070b1c');bg.addColorStop(1,'#02040b');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// nebula clouds
for(let i=0;i<5;i++){let x=W*(.16+i*.18),y=H*(.22+(i%3)*.23);glow(x,y,Math.min(W,H)*(.12+i*.025),i%2?'rgba(83,55,180,.10)':'rgba(25,139,190,.09)')}
stars.forEach(s=>{ctx.globalAlpha=s.a*(.75+.25*Math.sin(angle*2+s.phase));ctx.fillStyle='#d9edff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
let c=center(),scale=orbitScale();
if(showOrbits){planets.forEach(p=>{ctx.strokeStyle='rgba(130,190,255,.17)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(c.x,c.y,scale*p.orbit,scale*p.orbit*.55,0,0,Math.PI*2);ctx.stroke()})}
glow(c.x,c.y,18,'rgba(255,150,35,.5)');let sun=ctx.createRadialGradient(c.x-5,c.y-5,1,c.x,c.y,19);sun.addColorStop(0,'#fff8bf');sun.addColorStop(.4,'#ffcf4a');sun.addColorStop(1,'#f45b12');ctx.fillStyle=sun;ctx.beginPath();ctx.arc(c.x,c.y,15,0,Math.PI*2);ctx.fill();
if(showLabels){ctx.fillStyle='#ffe9a3';ctx.font='11px system-ui';ctx.fillText('SUN',c.x+21,c.y+4)}
planets.forEach((p,i)=>{let q=pos(p,i),r=p.size*(W<700?.85:1);glow(q.x,q.y,r,p.color+'55');ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();if(p.name==='Saturn'){ctx.strokeStyle='#d8c69b';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(q.x,q.y,r*1.8,r*.65,-.3,0,Math.PI*2);ctx.stroke()}if(p.name==='Jupiter'){ctx.strokeStyle='#9c6d50';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q.x,q.y,r*.5,0,Math.PI);ctx.stroke()}if(selected===i){ctx.strokeStyle='#b8f7ff';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(q.x,q.y,r+5,0,Math.PI*2);ctx.stroke()}if(showLabels){ctx.fillStyle='#d8e6ff';ctx.font='11px system-ui';ctx.fillText(p.name,q.x+r+5,q.y+4)}});
requestAnimationFrame(draw)}
let last=performance.now();function tick(now){let dt=Math.min((now-last)/1000,.05);last=now;if(playing)angle+=dt*.18*speed;requestAnimationFrame(tick)}requestAnimationFrame(tick);requestAnimationFrame(draw);
function show(index){selected=index;let p=index<0?{name:'The Sun',type:'Star · G2V',diameter:'1.39 million km',distance:'Center of our system',year:'~225–250 million years around galaxy',day:'~25 days at equator',moons:'0',desc:'The star at the heart of our solar system. Its gravity holds the planets in orbit.'}:planets[index];document.querySelector('#name').textContent=p.name;document.querySelector('.type').textContent=p.type;document.querySelector('#desc').textContent=p.desc;document.querySelector('#facts').innerHTML=[['Diameter',p.diameter],['Distance',p.distance],['Orbit / year',p.year],['Day length',p.day],['Known moons',p.moons]].map(([a,b])=>`<div class="fact"><small>${a}</small><b>${b}</b></div>`).join('');}
const nav=document.querySelector('#planetnav');['Sun',...planets.map(p=>p.name)].forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>show(i-1);nav.append(b)});
document.querySelector('#toggle').onclick=e=>{playing=!playing;e.target.textContent=playing?'Ⅱ Pause':'▶ Play'};
document.querySelector('#orbits').onclick=e=>{showOrbits=!showOrbits;e.target.classList.toggle('active',showOrbits)};
document.querySelector('#labels').onclick=e=>{showLabels=!showLabels;e.target.classList.toggle('active',showLabels)};
document.querySelector('#speed').oninput=e=>{speed=+e.target.value;document.querySelector('#speedval').textContent=speed.toFixed(1)+'×'};
document.querySelector('#zoom').oninput=e=>zoom=+e.target.value;
document.querySelector('#reset').onclick=()=>{angle=0;speed=1;zoom=1;playing=true;showOrbits=showLabels=true;document.querySelector('#speed').value=1;document.querySelector('#speedval').textContent='1.0×';document.querySelector('#zoom').value=1;document.querySelector('#toggle').textContent='Ⅱ Pause';document.querySelector('#orbits').classList.add('active');document.querySelector('#labels').classList.add('active');show(-1)};
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag){angle+=(e.clientX-lastX)*.004;lastX=e.clientX}});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('click',e=>{let c=center(),nearest=-1,dist=30;planets.forEach((p,i)=>{let q=pos(p,i),d=Math.hypot(q.x-e.clientX,q.y-e.clientY);if(d<dist){dist=d;nearest=i}});if(nearest>=0)show(nearest)});
show(-1);
</script>
</body></html>
